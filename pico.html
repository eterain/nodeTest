<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link rel="stylesheet" href="css/pico.min.css" />
        <title>Hello world!</title>
    </head>
    <body>
        <main class="container">
            <h1>Hello world!</h1>
        </main>

        <input type="text" name="text" placeholder="Text" aria-label="Text" />
        <input
            type="email"
            name="email"
            placeholder="Email"
            aria-label="Email"
            autocomplete="email"
        />
        <input
            type="number"
            name="number"
            placeholder="Number"
            aria-label="Number"
        />
        <input
            type="password"
            name="password"
            placeholder="Password"
            aria-label="Password"
        />
        <input
            type="tel"
            name="tel"
            placeholder="Tel"
            aria-label="Tel"
            autocomplete="tel"
        />
        <input type="url" name="url" placeholder="Url" aria-label="Url" />
    </body>
</html>
